  workflow_dispatch:

jobs:
  contract:
    runs-on: windows-latest
    steps:
      # fetch-depth: 0 plus fetch-tags, because check_docs.py reads the tag list
      # to prove every released version has a changelog section. A default
      # shallow checkout fetches no tags, and the check would then pass by
      # finding nothing - passing for the wrong reason is worse than failing.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
          fetch-tags: true

      - name: Verify the STRPM consumer contract
        shell: pwsh
        run: python Code/plugins/tools/strpm_contract.py check

      # The plugins are submodules pointing at repositories this project does
      # not control. If one disappears, a pointer to a commit nobody hosts is
      # not a backup, so a durable copy is kept in snapshots/ and must match
      # the pinned commit. Re-pinning without refreshing it fails here.
      - name: Verify the plugin source snapshots
        shell: pwsh
        run: python Code/plugins/tools/plugin_snapshot.py verify

      # A plugin patch that no longer applies is worse than a missing patch: the
      # fix silently stops reaching the build. This gate is why the pin cannot
      # move without the patches being rewritten in the same commit.
      - name: Verify the plugin patches still apply
        shell: pwsh
        run: python Code/plugins/tools/plugin_patches.py verify

      # The Papyrus compiler this project builds its scripts with is a pinned
      # GitHub release asset, and the pin cannot compile one of the shipping
      # scripts - the fix is unreleased. The archive under snapshots/tools is
      # what keeps that recoverable, so it is checked like any other backup.
      - name: Verify the Papyrus compiler source archive
        shell: pwsh
        run: python Tools/Scripts/papyrus_archive.py verify

      # A plugin resolves these entry points by name at runtime; a renamed or
      # missing export is invisible until a user's plugin silently finds nothing.
      - name: Verify the framework exports every contract entry point
        shell: pwsh
        run: python Code/plugins/tools/check_exports.py

      # The documented transport behaviour - new opcodes appended, chat opcode
      # indices unchanged - is what a reader relies on when reasoning about a
      # mixed-version session. Check it instead of trusting the prose.
      - name: Verify plugin transport compatibility
        shell: pwsh
        run: python Code/plugins/tools/check_transport_compat.py

      # The plugins reach RaceMenu by name, so a RaceMenu whose interfaces are a
      # different version is handed back as a pointer with a different vtable
      # order and every later call dispatches to the wrong method. That is the
      # skee64.dll+0x81be8 crash: OverlayType::Spell passed where
      # RevertHeadOverlays wanted a TESObjectREFR*, faulting at [1 + 0x14]. The
      # declarations are checked against RaceMenu's real order here, and each one
      # must carry the version it is valid for.
      #
      # The declarations that ship are the patched ones, so the patches have to
      # be on the tree before this reads it - the same apply the build runs. It
      # comes after the snapshot and patch gates above, which both want the
      # pristine pinned content.
      - name: Apply the plugin patches
        shell: pwsh
        run: python Code/plugins/tools/plugin_patches.py apply

      - name: Verify the SKEE interface declarations
        shell: pwsh
        run: python Code/plugins/tools/check_skee_abi.py

      # The contract header is vendored into each companion plugin, and its
      # interface structs are function-pointer tables whose ABI is the member
      # order. Nothing in the language, the linker or the exchange protocol
      # compares the copies, so a member inserted in one of them dispatches every
      # later call through the wrong slot inside a third-party DLL.
      - name: Verify every vendored contract copy is ABI-identical
        shell: pwsh
        run: python Code/plugins/tools/check_contract_copies.py

      # The refusal message is the only thing a player whose OStim runtime was
      # rejected ever reads, and nothing else binds it to the selector that
      # rejects them. The patch that added OStimNG 7.5.1.x support left it
      # naming 7.5.0.2 as the newest supported version, so a player refused on
      # 7.5.1 was told to install an OStim older than the one they already had.
      - name: Verify the OStim support message matches the selector
        shell: pwsh
        run: python Code/plugins/tools/check_ostim_support_message.py

      # SkyrimTogetherSKSE.dll is the loader that deploys and starts the
      # multiplayer runtime, and SKSE 2.2.x refuses to load a plugin that does
      # not export SKSEPlugin_Version - it logs "no version data" and moves on,
      # with no fallback to the legacy SKSEPlugin_Query this dll used to export
      # alone. The result is the esp files and the main-menu logo appearing
      # normally while the F2 menu never opens. SKSE 2.0.x (1.5.97) never reads
      # the export, which is why local testing on 1.5.x cannot see this.
      - name: Verify the SKSE bootstrap is loadable
        shell: pwsh
        run: python Code/plugins/tools/check_skse_bootstrap.py

      # The bootstrap above is one instance of a class this package has now paid
      # for three times: a plugin that satisfies one SKSE family and is skipped
      # outright by the other. SKSE 2.2.x (1.6.x/1.7.x) reads SKSEPlugin_Version
      # by name with no fallback to Query; SKSE 2.0.x (1.5.97) reads Query and
      # Load together and never looks for Version; and a version-dependent plugin
      # has its compatibleVersions list matched against the exact running build,
      # so a list holding one runtime rejects every other one this package ships
      # an address library for. This replays those rules over every hand-written
      # plugin and every shipped runtime, because none of the three reproduces on
      # the 1.5.97 machine the package is developed on.
      - name: Verify every plugin loads on every supported game line
        shell: pwsh
        run: python Code/plugins/tools/check_skse_entry_points.py

      # The game version is resolved from three sources, and the SKSE module
      # name is the authoritative one: SKSE is version-locked to the game, so the
      # module name survives the repacks and downgrades whose exe version
      # resource is missing or false. The scan looks for `skse64_*` and parses
      # the version out of the name - but `skse64_steam_loader.dll` carries that
      # prefix while naming no version, so a scan that stops on the prefix
      # instead of on the parse returns nothing whenever the loader is enumerated
      # first, and silently falls back to the two sources this step replaces. Two
      # translation units ask this of the same module list, so both are checked.
      - name: Verify the SKSE module-name scan keeps looking
        shell: pwsh
        run: python Tools/Scripts/check_skse_module_scan.py

      # A noexcept frame that allocates ends the game with no crash dump when the
      # allocation fails, and the companion plugins are separate DLLs whose
      # copies of the same helper were never compared: the plugin load path
      # builds a std::wstring to look beside itself, and four plugins carry their
      # own copy of it. The OStimNG Thread API is the same shape - noexcept entry
      # points in a vtable OStimTogether copies verbatim, with bodies that grow
      # containers.
      - name: Verify no plugin load path can terminate the game
        shell: pwsh
        run: python Code/plugins/tools/check_noexcept_allocations.py

      # OStimNG is the prerequisite OStim Together drives, and it resolves
      # engine addresses through the SKSE address library. An id absent from the
      # library for the runtime actually running does not degrade: REL::ID()
      # aborts the game at load. "1.5.x through 1.7.x" is therefore a claim about
      # id coverage in the shipped libraries, and it is checked rather than
      # assumed - for every pre-AE library and every AE one, because passing on
      # 1.5.97 while aborting on 1.6.1170 is exactly the regression this exists
      # to catch.
      - name: Verify OStimNG loads on every supported runtime
        shell: pwsh
        run: python Code/plugins/tools/check_ostimng_versions.py

      # The OStimNG build needs a CommonLibSSE-NG SOURCE checkout, and the pinned
      # OStimNG no longer carries one: commit f20db82 deleted its
      # skse/extern/CommonLibSSE-NG gitlink when OStimNG moved to vcpkg, so the
      # path the CI step asserted on stopped existing and three workflows failed
      # before configuring. The revision is pinned in Code/plugins/plugins.json
      # now, and this binds the two together - the manifest must declare it and
      # the step must read it, or the build silently goes back to a hard-coded
      # path that only CI can disprove.
      - name: Verify the OStimNG build inputs are pinned
        shell: pwsh
        run: python Code/plugins/tools/check_ostimng_build.py

      # A workflow's run: block only ever executes on a runner, so a syntax error
      # in one is invisible until the job starts - and a job that cannot start
      # reports nothing useful. The OStimNG prerequisite step shipped with an
      # unterminated string literal, so PowerShell refused to parse the whole
      # block, the step exited before running a command, and three workflows
      # failed with no CMake output to explain why. Every other gate passed,
      # because none of them read the workflow files.
      # pyyaml is installed here, in the job that runs the gate. It used to be
      # installed only in `wizard`, and the gate used to print SKIPPED and exit 0
      # when the import failed - so in this job it checked nothing and reported
      # success. The gate now fails without pyyaml, and this step supplies it.
      - name: Verify every PowerShell workflow block parses
        shell: pwsh
        run: |
          python -m pip install --quiet --disable-pip-version-check pyyaml
          python Code/plugins/tools/check_workflow_shell.py

      # CODE_GUIDELINES.md makes documentation part of every version change.
      # This is what enforces it: the coverage figures in prose must match the
      # generator, both README version tables must cover every changelog
      # version, every tagged release must have a changelog section, and the
      # recommended version must be one that exists.
      # The preprocessed-head flag is the fix for neck seams and black faces on
      # ordinary characters, and clearing it globally is the fix for a head that has
      # no baked mesh on disk - such as a custom race's, or any remote player's.
      # Both directions have been shipped by mistake, so the scope is checked:
      # cleared only for actors whose appearance arrived over the wire, from a saved
      # value, before the engine builds their body.
      - name: Verify the preprocessed-head flag stays scoped
        shell: pwsh
        run: python Tools/Scripts/check_facegen_scope.py

      # CODE_GUIDELINES.md makes documentation part of every version change.
      # This is what enforces it: the coverage figures in prose must match the
      # generator, both README version tables must cover every changelog
      # version, every tagged release must have a changelog section, and the
      # recommended version must be one that exists.
      - name: Verify the documentation matches the code
        shell: pwsh
        run: python Tools/Scripts/check_docs.py

      # The engine singletons this client reaches through are null before the
      # engine builds them, and on a legacy runtime an unmapped id resolves to
      # an executable stub instead. A call site that dereferences one without a
      # guard is a crash on every game version, so every one of them is checked.
      - name: Verify no engine singleton is dereferenced unchecked
        shell: pwsh
        run: python Tools/Scripts/check_null_accessors.py

      # The docs tell a player reporting a crash to send in crash_*.dmp. The
      # dump used to be behind IS_MASTER, which is 1 in every build this repo
      # ships (its release branch is `main`), so the artifact the docs promised
      # could not exist. Both sides were internally consistent, which is why
      # neither noticed; this compares them.
      - name: Verify the documented crash artifacts are produced
        shell: pwsh
        run: python Tools/Scripts/check_crash_diagnostics.py

      # ExtraDataList is this client's own reimplementation of an engine
      # structure. Its read side treated an absent bitfield as "no bits set"
      # while its write side dereferenced it, and New() wrote through both of
      # its allocations without checking either. Both are crash classes on
      # every game version.
      - name: Verify hand-rolled engine helpers check what they allocate
        shell: pwsh
        run: python Tools/Scripts/check_allocation_guards.py

      # A message is defined twice, once per direction, and nothing ties the two
      # together. A field written but not read shifts every later field by its
      # width, and the reader still has bytes, so the symptom is a message with
      # wrong values rather than a decode failure.
      - name: Verify every message writes and reads the same fields
        shell: pwsh
        run: python Tools/Scripts/check_wire_symmetry.py

      # A plugin send carries a flag set and a sequence number, and the contract
      # promises the receiver sees them back. The framework transport took the flags
      # argument and dropped it, then reported kMessageNone and 0 to every receiver -
      # a value invented at the far end is indistinguishable from one that arrived,
      # so only the sender and receiver together can prove the envelope survives.
      - name: Verify the plugin message flags and sequence survive the round trip
        shell: pwsh
        run: python Tools/Scripts/check_message_flags_parity.py

      # The 1.5.x patch offsets are measurements, checked in as a tsv. Nothing
      # connected that file to the call sites that use the numbers, so a row
      # could be regenerated or a site edited and both sides keep their own
      # story - and a 1.5.x offset no row backs is a number nobody measured
      # written into a running game.
      - name: Verify the patch offsets agree with their measurements
        shell: pwsh
        run: python Tools/Scripts/check_patch_offsets.py

      # The override table is the input the shipped AE-to-SE map is generated
      # from, and its reader keeps the last value for a repeated id. That is how
      # it came to hold two RVAs for id 35086 with the map agreeing with
      # whichever was last; the stale one was nine bytes into a function that
      # Actor.cpp resolves a live pointer through.
      - name: Verify the AE-to-SE override table is a valid map input
        shell: pwsh
        run: python Tools/Scripts/check_ae_to_se_overrides.py

      # st_target_meta_1170.json is the evidence behind the address-library ids
      # the client resolves, and nothing read it. It makes three checkable
      # claims: the recorded address, the client binding, and that the id
      # resolves on every AE runtime rather than only the one it is named for.
      - name: Verify the recorded engine targets still describe the client
        shell: pwsh
        run: python Tools/Scripts/check_target_meta.py

      # Cast<T>() resolves its ids through the official address libraries, which
      # this repo ships but cannot edit - rewriting one breaks the hash
      # CheckAddressLibrary verifies. A handful of ids are therefore missing on a
      # few runtimes, and a cast to one of those types returns nullptr instead of
      # crashing, so nothing local would notice it. This holds the registration
      # table against every shipped library and fails the moment a call site
      # reaches a gap that was recorded rather than closed.
      - name: Verify every cast resolves on every shipped address library
        shell: pwsh
        run: python Tools/Scripts/check_rtti_coverage.py

      # st_capstone_report.json is the matching log behind the 1.5.97 offsets,
      # and two of its candidates disagree with the map that ships. Both were
      # checked against the real executable and the map is right in both, so the
      # rejections are recorded - which is what this pins, along with the
      # correlation that every disagreement is in a low similarity band.
      - name: Verify the 1.5.97 matching report against the shipped map
        shell: pwsh
        run: python Tools/Scripts/check_capstone_report.py

      # The address-library fallback used to return the first file a directory
      # enumeration produced, and a modlist ships many: the installed game has
      # ten pre-AE libraries from 1.5.3 to 1.5.97, and 98.7% of the ids they
      # share resolve to different RVAs. It is now family-scoped and takes the
      # highest version, and this checks both.
      - name: Verify the address-library fallback cannot pick another game's library
        shell: pwsh
        run: python Tools/Scripts/check_library_scan.py

      # The same resource query - ProductVersion, falling back to FileVersion -
      # is written out three times, and one copy tested one thing less than the
      # others: an empty ProductVersion counted as a version, so the launcher
      # aborted with "Failed to query game version" while FileVersion was there
      # to be read.
      - name: Verify the three game-version queries test the same things
        shell: pwsh
        run: python Tools/Scripts/check_version_queries.py

      # The installer wizard's metadata is player-facing: the version MO2 shows
      # and the game versions the description claims. The version had drifted
      # four releases behind, because "keep it in step with the newest tag" was
      # only a comment.
      - name: Verify the installer metadata matches the release
        shell: pwsh
        run: python Tools/Scripts/check_package_metadata.py

      # Ten pre-AE maps ship, one per 1.5.x build, and only the 1.5.97 one was
      # ever accounted for: an id the table does not carry resolves to the
      # zero-returning stub on legacy runtimes, so "1.5.x is supported" is a
      # claim about each of the ten. Id 16113 was missing from three of them
      # while the other seven carried it, and nothing compared the results
      # because the check that existed read one map.
      - name: Verify every shipped address map covers the ids the client resolves
        shell: pwsh
        run: python Tools/Scripts/check_map_coverage.py

      # The client is built twice from one set of sources, and the two targets do
      # NOT agree on where the engine's fields live. PITFALLS section 2 calls the
      # resulting hand-written offsets the most dangerous area in the repository,
      # and it has bitten three times, always by one branch adopting the other
      # target's number and silently reading the neighbouring field. The defence
      # is a static_assert per branch - which was a checklist item nothing ran.
      - name: Verify every target-dependent struct layout stays pinned
        shell: pwsh
        run: python Tools/Scripts/check_branch_layouts.py

      # The overlay is a CEF browser, so the client talks to it by building JSON
      # text: no type, no schema, no compiler between the two languages. Two
      # vocabularies cross that boundary - the connection-failure codes (turned
      # into translation keys by concatenation, so a code with no entry shows the
      # player a raw key) and the mods-mismatch direction (which was carried by
      # "Id == 0", and 0 is a real id: the first plugin, and the first ESL).
      - name: Verify the C++ UI vocabulary matches the strings and translations
        shell: pwsh
        run: python Tools/Scripts/check_ui_contract.py

      # Whether a lite (ESL) file survives Mod::IsLoaded() is not answered in this
      # repository - the engine headers are not here - and the two answers differ
      # by a lot: a dropped ESL is a mod the server never registers, so every form
      # it adds loses its server id. So the decision is instrumented rather than
      # guessed at, and this keeps the instrument (and the lite path under it)
      # from quietly disappearing.
      - name: Verify the lite-mod question is still answerable
        shell: pwsh
        run: python Tools/Scripts/check_lite_mod_path.py

      # A UI button reaches the game through three separately written lists: the
      # typings, the render-process registrations (a name that is not registered
      # throws in the browser) and the game-side dispatch (a registered name with
      # no branch is dropped silently). Nothing compared them, and both shipped
      # defects were exactly that: the play guide's registration was missing while
      # its dispatch and ShellExecuteW existed, and the reconnect call was declared
      # and mocked but implemented in neither layer.
      - name: Verify the overlay bridge agrees across all three layers
        shell: pwsh
        run: python Tools/Scripts/check_overlay_bridge.py

      # check_wire_symmetry proves the two directions transfer the same fields. It
      # does not ask whether the value means anything to the receiver, and a field
      # transferred and dropped is the quietest defect in the protocol: the bytes
      # are consumed, every check passes, and the feature behind it never happens.
      # RequestQuestSceneUpdate carried one (see docs/PITFALLS.md section 135).
      - name: Verify the scene-update fields are read where they arrive
        shell: pwsh
        run: python Tools/Scripts/check_wire_field_reads.py

      # Console settings self-register into one global list in construction order,
      # and a name resolves with std::find_if - so two declarations of one name are
      # two objects where only the first receives the ini value, and which one that
      # is depends on static initialisation order across translation units.
      # LiveServices:bAnnounceServer was declared twice and read by both.
      - name: Verify no console setting name is declared twice
        shell: pwsh
        run: python Tools/Scripts/check_console_settings.py

      # spdlog formats through fmt, which throws when a format string asks for an
      # argument that was not passed. The throw happens as the line is written, so
      # a log call that only fires on a rare path is exactly the one that is never
      # exercised until it matters. A line with arguments its format never uses is
      # the quieter half: the values it computed are simply not in the log.
      - name: Verify every log call passes the arguments its format asks for
        shell: pwsh
        run: python Tools/Scripts/check_log_format_args.py

      # Transloco substitutes the parameters it is handed and leaves the rest as
      # literal text, so a key that asks for {{length}} and a call site that passes
      # nothing means the player reads "{{length}}". Three ways to get it wrong:
      # a translation that drops the placeholder, a call site that passes the wrong
      # name, and the error panel, which builds its key at runtime from the code.
      - name: Verify translation placeholders and the parameters handed to them agree
        shell: pwsh
        run: python Tools/Scripts/check_i18n_params.py

      # Each factory fills a table of extractors from a hand-written type list, and
      # Extract() checks the opcode's range but not that its slot was ever filled. A
      # slot the list does not name holds an empty std::function: calling through it
      # throws from a noexcept function, so one byte on the wire ends the process.
      - name: Verify every opcode has an extractor and every message an opcode
        shell: pwsh
        run: python Tools/Scripts/check_message_factories.py

      # A message can be complete in every mechanical sense - opcode, extractor,
      # serialisation, a handler on the other side - and still be dead because
      # nothing constructs it. That is how NotifyDrawWeapon shipped: the client sent
      # DrawWeaponRequest, the server applied it and broadcast nothing, so a player
      # who drew after spawning was invisible to everyone who had them loaded.
      - name: Verify every wire message is either sent or handled
        shell: pwsh
        run: python Tools/Scripts/check_message_use.py

      # SksePluginVersionData is written out by hand because the plugin does not
      # link SKSE's headers, and SKSE reads it out of this dll's exports by offset -
      # it never sees the field names. A field added or an array resized moves every
      # field after it and SKSE then reads the name as the author, silently, because
      # the export is still present and still called SKSEPlugin_Version.
      - name: Verify the hand-written SKSE ABI mirrors still match SKSE's layout
        shell: pwsh
        run: python Tools/Scripts/check_skse_abi.py

      # The game structs mirror the engine's memory and their layouts differ between
      # the pre-AE and AE runtimes, so the assertions come in #ifdef pairs. Within one
      # branch an offset identifies one field and a field has one offset; a
      # copy-pasted assert with a stale number breaks one of those, and the runtime it
      # breaks on is the branch it sits in.
      - name: Verify the game structs' layout assertions are self-consistent
        shell: pwsh
        run: python Tools/Scripts/check_layout_asserts.py

      # The Papyrus variable type tag is defined twice: once in the loader that parses
      # .pex chunks and once in the client that registers natives with the VM. Same
      # numbers, no name in common (INVALID/OBJECT/... against kEmpty/kObject/...),
      # and nothing held them together.
      - name: Verify the Papyrus type tables still agree
        shell: pwsh
        run: python Tools/Scripts/check_papyrus_types.py

      # The installer wizard ships every option in two languages as parallel
      # branches of one XML. A file added to the English branch and not the Chinese
      # one installs a different mod depending on the language the player picked,
      # and nothing in the build reads both branches.
      - name: Verify both installer wizard languages offer the same options
        shell: pwsh
        run: python Tools/Scripts/check_fomod_languages.py

      # The build requires a minimum xmake in xmake.lua and the workflows install a
      # pinned one. Those are different numbers with a real invariant between them -
      # installed >= required - and nothing compared them, so raising the requirement
      # past the pin would break every workflow at configure time.
      - name: Verify the workflows install an xmake the build accepts
        shell: pwsh
        run: python Tools/Scripts/check_xmake_version.py

      # A shipping script compiles to a .pex that is committed and packaged, while
      # the .psc is the only record of what it came from. Nothing in the tree reads
      # the .pex, so editing the source without recompiling ships a script that does
      # not do what the source says - and the source is what a reader trusts.
      - name: Verify every shipped .pex still names what its .psc declares
        shell: pwsh
        run: python Tools/Scripts/check_shipped_pex.py

      # A Papyrus `native` is a promise that some C++ registers that class and name.
      # Nothing compares the two lists: an unregistered native returns the return
      # type's default forever, and a renamed registration leaves the script calling
      # a function that no longer exists. The parameter count is checked too, because
      # the VM refuses a call whose argument count does not match.
      - name: Verify every Papyrus native is registered under its own name
        shell: pwsh
        run: python Tools/Scripts/check_papyrus_natives.py

      # A gate that exits 0 when it cannot run is worse than no gate: CI shows a
      # green step and nobody learns the check never happened. check_workflow_shell.py
      # did exactly that for a missing pyyaml, in a job that never installed it.
      - name: Verify no gate reports success when it cannot check
        shell: pwsh
        run: python Tools/Scripts/check_gate_integrity.py

  wizard:
    runs-on: windows-latest
    steps:
      # No submodules: the wizard only depends on the manifest and the schema.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate the generated installer wizard
        shell: pwsh
        run: |
          python -m pip install --quiet --disable-pip-version-check pyyaml
          python Code/plugins/tools/merge_fomod.py check

      - name: Check the packaging scripts parse
        shell: pwsh
        run: |
          foreach ($script in 'Tools/Packaging/Add-PluginPayload.ps1', 'Tools/Packaging/New-STNModPackage.ps1') {
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script).Path, [ref]$null, [ref]$errors)
            if ($errors.Count -gt 0) {
              Write-Host "::error file=$script::$($errors[0].Message)"
              $errors | Select-Object -First 5 | ForEach-Object { Write-Host "  $($_.Extent.StartLineNumber): $($_.Message)" }
              exit 1
            }
            Write-Host "$script : syntax OK"
          }
          Write-Host ('manifest plugins: ' + ((Get-Content Code/plugins/plugins.json -Raw | ConvertFrom-Json).plugins.Count))