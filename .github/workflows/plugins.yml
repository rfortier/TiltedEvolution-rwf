      - 'Code/client/Games/**'
      - 'Code/client/TiltedOnlineApp.cpp'
      - 'Tools/Scripts/check_facegen_scope.py'
      # Same for the null-accessor gate: it reads every client source file.
      - 'Code/client/**'
      - 'Tools/Scripts/check_null_accessors.py'
      # And the crash-diagnostics gate, which reads the handler, the pitfalls
      # doc and the branch definition.
      - 'Tools/Scripts/check_crash_diagnostics.py'
      - 'xmake.lua'
      # And the allocation-guard gate, which reads the hand-rolled engine helpers.
      - 'Tools/Scripts/check_allocation_guards.py'
      # And the wire-symmetry gate, which reads every message.
      - 'Code/encoding/**'
      - 'Tools/Scripts/check_wire_symmetry.py'
      # And the flags-parity gate, which reads the plugin messaging service on both
