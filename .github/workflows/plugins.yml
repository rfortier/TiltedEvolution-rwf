name: Plugin gates

# Fast gates for the companion-plugin layer. Both jobs run in seconds and need
# no toolchain, so they are worth blocking on for every change that touches the
# interface header, a plugin submodule pin, or the installer wizard.
#
#   contract  the consumer repositories compile against one ABI; a consumer that
#             vendored an older copy of the header must fail here, not at
#             runtime on a player's machine
#   wizard    the generated FOMOD must match the packaging manifest and stay
#             valid against the published FOMOD 5.0 schema
#   exports   the framework runtime must export the entry point names the
#             contract advertises, because plugins look them up as strings
#   transport the plugin opcodes must stay appended and the chat opcode indices
#             must not move, or the documented fallback stops being true
#   snapshots the durable copy of each plugin's source must match the pinned
#             commit, so a submodule re-pin cannot silently outrun its backup

on:
  push:
    branches: [main]
    paths:
      - 'Code/plugins/**'
      - 'plugins/**'
      - 'GameFiles/Skyrim/fomod/**'
      - 'Tools/Packaging/**'
      - 'Tools/Scripts/papyrus_archive.py'
      # The facegen gate reads the client's spawn paths, so a change to the code
      # it guards has to run it - otherwise the scope can be widened back to a
      # client-wide force without CI noticing.
      - 'Code/client/Services/**'
      - 'Code/client/Games/**'
      - 'Code/client/TiltedOnlineApp.cpp'
      - 'Tools/Scripts/check_facegen_scope.py'
      # The null-accessor gate reads every client source file, so any of them can
      # introduce an unguarded dereference; it also reads its own exceptions list.
      - 'Code/client/**'
      - 'Tools/Scripts/check_null_accessors.py'
      # The crash-diagnostics gate reads the handler, the pitfalls doc and the
      # branch definition in xmake.lua, so a change to any of the three matters.
      - 'Tools/Scripts/check_crash_diagnostics.py'
      - 'xmake.lua'
      # The allocation-guard gate reads the hand-rolled engine helpers.
      - 'Tools/Scripts/check_allocation_guards.py'
      # The wire-symmetry gate reads every message under Code/encoding/Messages.
      - 'Code/encoding/**'
      - 'Tools/Scripts/check_wire_symmetry.py'
      # The flags-parity gate reads the plugin messaging service on both sides plus
      # the two wire messages that carry the envelope.
      - 'Tools/Scripts/check_message_flags_parity.py'
      # The patch-offset gate reads the client's At() call sites and the checked-in
      # measurement they must agree with.
      - 'Tools/Scripts/check_patch_offsets.py'
      - 'Tools/ida/st_patch_offsets_1597.tsv'
      # The override gate reads the override table and the address library and
      # shipped map it must stay consistent with.
      - 'Tools/Scripts/check_ae_to_se_overrides.py'
      - 'Tools/ida/st_overrides_all.tsv'
      - 'GameFiles/Skyrim/SKSE/Plugins/**'
      # The target-metadata gate reads the recorded targets, the client bindings
      # they name, and every AE address library.
      - 'Tools/Scripts/check_target_meta.py'
      - 'Tools/ida/st_target_meta_1170.json'
      # The RTTI-coverage gate reads the client's RttiLocator table, every cast
      # site under Code, and every shipped address library.
      - 'Tools/Scripts/check_rtti_coverage.py'
      # The capstone gate reads the matching log and the shipped map.
      - 'Tools/Scripts/check_capstone_report.py'
      - 'Tools/ida/st_capstone_report.json'
      # The library-scan gate reads the client bootstrap, its build file, and the
      # address libraries on disk.
      - 'Tools/Scripts/check_library_scan.py'
      - 'Code/skse_client/**'
      # The version-query gate reads all three implementations of the query.
      - 'Tools/Scripts/check_version_queries.py'
      - 'Code/immersive_launcher/**'
      # The package-metadata gate reads the installer metadata and the tag list.
      - 'Tools/Scripts/check_package_metadata.py'
      - 'GameFiles/Skyrim/fomod/**'
      # The map-coverage gate reads every shipped pre-AE map, both id manifests
      # and the client sources it counts ids in, so any of them can change it.
      - 'Tools/Scripts/check_map_coverage.py'
      - 'Tools/missing_ids_by_runtime.tsv'
      - 'Tools/missing_1_5_97_ids.txt'
      - 'GameFiles/Skyrim/SKSE/Plugins/versionlib-ae-to-se-*.map'
      - 'GameFiles/Skyrim/SKSE/Plugins/version-*.bin'
      - 'Code/client/**'
      # The branch-layout gate reads every client file that branches on the
      # target macro, and both targets are built from those same sources.
      - 'Tools/Scripts/check_branch_layouts.py'
      - 'Code/client/**'
      # The UI-contract gate reads the C++ payload builders, the language files
      # and the TS that switches on what they send.
      - 'Tools/Scripts/check_ui_contract.py'
      - 'Code/server/**'
      - 'Code/encoding/Structs/Mods.h'
      - 'Code/skyrim_ui/src/**'
      # The lite-mod gate reads the auth-request builder, the mod table builder
      # and the struct fields the diagnostic prints.
      - 'Tools/Scripts/check_lite_mod_path.py'
      - 'docs/FOLLOW-UP.md'
      # The overlay-bridge gate reads all three layers of the UI to game bridge:
      # the typings, the render-process registrations and the game-side dispatch.
      - 'Tools/Scripts/check_overlay_bridge.py'
      - 'Code/tp_process/**'
      # The wire-field-read gate reads the two scene-update messages and the
      # handlers they arrive in.
      - 'Tools/Scripts/check_wire_field_reads.py'
      - 'Code/encoding/Messages/RequestQuestSceneUpdate.*'
      - 'Code/encoding/Messages/NotifyQuestSceneUpdate.*'
      - 'Code/encoding/Structs/ServerSettings.*'
      # The setting-name gate reads every Console::Setting declaration; a name
      # declared twice resolves to whichever registers first.
      - 'Tools/Scripts/check_console_settings.py'
      # The log-format gate reads every spdlog call in the tree, so any source
      # file can carry a call whose placeholders and arguments disagree.
      - 'Tools/Scripts/check_log_format_args.py'
      - 'Code/**'
      # The i18n parameter gate reads the catalogs, the templates and the services
      # that render a key; transloco prints a placeholder it was not handed.
      - 'Tools/Scripts/check_i18n_params.py'
      - 'Code/skyrim_ui/src/**'
      # The message-factory gate reads the opcode enums, the visitor type lists and
      # the message headers that declare an opcode.
      - 'Tools/Scripts/check_message_factories.py'
      # The message-use gate reads every message type and both sides' sources: a
      # message nobody sends, or nobody handles, is a feature that is simply absent.
      - 'Tools/Scripts/check_message_use.py'
      # The SKSE ABI gate reads the hand-written mirrors of SKSE's plugin structs,
      # which SKSE reads by offset out of this dll's exports. The module-scan gate
      # reads both copies of the game-version scan - one of them in the client,
      # which the library-scan gate above already covers - and the
      # noexcept-allocation gate reads the plugin load path in every companion
      # plugin (covered by plugins/**) plus the OStimNG Thread API.
      - 'Tools/Scripts/check_skse_abi.py'
      - 'Code/skse_bootstrap/**'
      - 'Tools/Scripts/check_skse_module_scan.py'
      - 'Code/plugins/tools/check_noexcept_allocations.py'
      - 'Code/plugins/patches/**'
      # The layout-assert gate reads the game structs' offsetof assertions and the
      # preprocessor branches they sit in.
      - 'Tools/Scripts/check_layout_asserts.py'
      - 'Code/client/Games/**'
      # The Papyrus type gate reads the loader's chunk table and the client's VM
      # table, which number the same tag space with no name in common.
      - 'Tools/Scripts/check_papyrus_types.py'
      # The wizard gate reads both language branches of the installer XML; the
      # xmake gate reads the version the build requires and the one the workflows
      # install; the integrity gate reads these workflows themselves, so it has to
      # run when they change or it would never see its own subject.
      - 'Tools/Scripts/check_fomod_languages.py'
      - 'Tools/Scripts/check_xmake_version.py'
      - 'Tools/Scripts/check_gate_integrity.py'
      # The shipped-.pex gate pairs each script under GameFiles/Skyrim/scripts/source
      # with the .pex committed beside it. The .pex is what actually ships, nothing
      # else in the tree reads it, and it was never compared against its source.
      - 'Tools/Scripts/check_shipped_pex.py'
      - 'GameFiles/Skyrim/scripts/**'
      # The Papyrus native gate pairs each .psc `native` declaration with the C++
      # registration that answers it, in both directions, plus the parameter count
      # the VM checks. The scripts live under plugins/** and GameFiles/**; the
      # registrations under Code/client/** and plugins/*/src.
      - 'Tools/Scripts/check_papyrus_natives.py'
      - '.github/workflows/**'
      - 'Code/components/es_loader/Records/Chunks.*'
      - 'Code/client/Games/Skyrim/Misc/BSScript.*'
      - 'Code/encoding/**'
      - 'Code/admin_protocol/**'
      # The documentation gate reads these, so a change to any of them has to
      # run it - otherwise a stale number can be pushed without CI noticing.
      - 'Tools/Scripts/check_docs.py'
      - 'README.md'
      - 'README_EN.md'
      - 'CHANGELOG.md'
      - 'CODE_GUIDELINES.md'
      - 'docs/**'
      - 'Tools/missing_1_5_97_ids.txt'
      - '.github/workflows/plugins.yml'
      # The snapshot gate exists to protect snapshots/, so it has to run when
      # they change - and when .gitignore changes, because an ignore rule is
      # what silently excluded 22 of them the first time.
      - 'snapshots/**'
      - '.gitignore'
  pull_request:
    paths:
      - 'Code/plugins/**'
      - 'plugins/**'
      - 'GameFiles/Skyrim/fomod/**'
      - 'Tools/Packaging/**'
      - 'Tools/Scripts/papyrus_archive.py'
      # The facegen gate reads the client's spawn paths, so a change to the code
