      - 'Tools/ida/st_target_meta_1170.json'
      # And the RTTI-coverage gate, which reads the client's RttiLocator table,
      # every cast site under Code, and every shipped address library.
      - 'Tools/Scripts/check_rtti_coverage.py'
      # And the capstone gate, which reads the matching log and the shipped map.
