[Network]
; Runtime master switch.
Enabled=1

; Legacy UDP settings below are ignored by the default private STR-only build.
; They only matter if the DLL is rebuilt with STRPM_ENABLE_UDP_BACKEND=ON.
LocalPort=27990
AutoDiscovery=1

; 1 = report "target not found" until at least one peer is known/configured.
; This avoids silent false positives in remote/no-port tests where LAN
; broadcast cannot reach the other player.
RequireKnownPeer=1

RelayMode=0
DiscoveryIntervalMs=1500
PeerTimeoutMs=15000

RemotePeer1=
RemotePeer2=
RemotePeer3=
RemotePeer4=

[Transport]
; STR = require the STR 1.8.0 chat-tunnel bridge and never open legacy UDP.
Mode=STR

; v0.7.0+ consumes reserved STRPM|v2| chat packets at
; TransportService::OnConsume before STR creates/dispatches its normal chat
; message. Ordinary STR packets and user chat continue through STR unchanged.
;
; v0.8.0 additionally exposes ProxyResolver. The server must use the v3 relay
; resource so authenticated senderPlayerId metadata is available to the bridge.
STRBridgeModule=STRPluginMessagingBridge.dll

[Identity]
DisplayName=

[Security]
SharedSecret=
