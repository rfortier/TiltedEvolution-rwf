; MorphSyncTogether v0.4.2
;
; Skyrim Together / RaceMenu appearance synchronizer using STRPluginMessagingAPI.

[Network]
; 1 disables MorphSyncTogether. STRPM owns discovery, peer identity and transport.
Disabled=0

[MorphSync]
SyncIntervalMs=1000
FullResendMs=5000
; Safety fallback only. Repeated STRPM snapshots refresh the authoritative state every 5s.
RemoteReapplyMs=15000
ClearRemoteMorphs=1

[PubicOverlaySync]
; Global BodyHairSliders/OPubes overlay transport switch.
; Individual providers are selected by FOMOD marker files under:
; Data/SKSE/Plugins/MorphSyncTogether/Providers/
Enabled=1

; TNG genital-size synchronization is optional. The installer detects
; TheNewGentleman.esp and marks TNG support as Recommended when present.
; Selecting it installs:
; Data/SKSE/Plugins/MorphSyncTogether/Providers/TNG.enabled
; It synchronizes the effective live GenBase scale and applies TNG's matching
; GenScrot compensation (1 / sqrt(scale)) to remote STR player proxies.

[AppearanceProbe]
Enabled=1
IntervalMs=1000
Verbose=1

[AppearancePreserve]
Enabled=1
RecoveryAttempts=3

[FaceMaterialRebind]
Enabled=1
FollowupPasses=3
FollowupIntervalMs=1000
