[Network]
# TradeTogether v0.11.0-strpm uses STR Plugin Messaging exclusively.
# No TradeTogether UDP socket, port forwarding, PeerHost or LAN discovery is used.
Disabled=0

[Trade]
# The targeted player has this long to accept or refuse the request.
RequestTimeoutMs=30000

# Maximum inactivity while both players compose and confirm their offers.
SessionTimeoutMs=300000

[Controls]
# DirectInput / SkyUI keymap scan codes. These values can be changed through
# the TradeTogether MCM and are applied immediately at runtime.
TradeKey=20
AddItemKey=210
RemoveItemKey=211
GoldAddKey=78
GoldRemoveKey=74
CancelKey=15
