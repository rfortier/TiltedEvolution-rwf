; STR Plugin Messaging API - companion plugin transport.
;
; This file is owned by Skyrim Together Next, not by the STRPluginMessagingAPI
; repository it describes. It overrides the copy inside that project at package
; time (see Code/plugins/plugins.json), because the upstream copy cannot be
; changed from here: the plugin repositories are pinned submodules and are not
; pushed to by this project.
;
; In this framework the file is only a fallback. SkyrimTogetherRuntime.dll
; exports the same entry points as the STRPM facade and answers them with a
; transport that rides the framework's own session, so a plugin that queries the
; framework directly needs none of this.
;
; It still matters for a plugin that loads STRPluginMessagingAPI.dll by name
; first: the facade then picks its transport here, and this is where the choice
; between the framework and the standalone bridge is made.

[Network]
; Runtime master switch.
Enabled=1

; Legacy UDP settings below are ignored by the default private STR-only build.
; They only matter if the DLL is rebuilt with STRPM_ENABLE_UDP_BACKEND=ON.
LocalPort=27990
AutoDiscovery=1

; 1 = report "target not found" until at least one peer is known/configured.
; This avoids silent false positives in remote/no-port tests where LAN
; broadcast cannot reach the other player.
RequireKnownPeer=1

RelayMode=0
DiscoveryIntervalMs=1500
PeerTimeoutMs=15000

RemotePeer1=
RemotePeer2=
RemotePeer3=
RemotePeer4=

[Transport]
; Auto = use whichever transport module loads, preferring the one named below.
;
; Inside Skyrim Together Next this file is usually not consulted at all: the
; framework runtime exports the same entry points as the facade and answers
; them with a transport over the framework's own session, so a plugin that
; queries the framework directly never loads the facade.
;
; It matters for a plugin that loads STRPluginMessagingAPI.dll by name first.
; The facade then picks its transport here, and the default is the standalone
; bridge - which is what such a session needs if it is hosted by an unmodified
; Skyrim Together Reborn server, since that server has no plugin channel of
; its own and can only carry bytes inside chat.
Mode=Auto

; The framework runtime cannot be named here reliably: it is
; SkyrimTogetherRuntime.dll on 1.6.x/1.7.x and SkyrimTogetherRuntime_1_5.dll on
; 1.5.x, and the loader matches exact module names only. Naming one of them
; would silently fail on the other game version, so the default names the
; bridge, which has one name everywhere.
;
; To force the facade onto the framework's own transport, name the runtime that
; matches your game version:
;   1.6.x / 1.7.x : STRBridgeModule=SkyrimTogetherRuntime.dll
;   1.5.x         : STRBridgeModule=SkyrimTogetherRuntime_1_5.dll
STRBridgeModule=STRPluginMessagingBridge.dll

[Identity]
DisplayName=

[Security]
SharedSecret=